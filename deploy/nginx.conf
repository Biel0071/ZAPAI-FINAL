# ============================================================
# Nginx config for ZapAI CRM — HTTPS mode
#
# Replace YOUR_DOMAIN with your actual domain.
# Place at:  /etc/nginx/sites-available/zapai
# Enable:    ln -s /etc/nginx/sites-available/zapai /etc/nginx/sites-enabled/zapai
# Test:      nginx -t && systemctl reload nginx
#
# For HTTP-only (no domain), install.sh creates a simpler config.
# To add HTTPS after HTTP-only install:
#   apt install certbot python3-certbot-nginx
#   certbot --nginx -d YOUR_DOMAIN
# ============================================================

server {
    listen 80;
    server_name YOUR_DOMAIN;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name YOUR_DOMAIN;

    # --- TLS (Certbot will manage these) ---
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # --- Security headers ---
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # --- Frontend (Vite build) ---
    root /opt/zapai/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Backend REST API ---
    location /api/ {
        proxy_pass         http://127.0.0.1:4025;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        client_max_body_size 25M;
    }

    # --- Auth endpoint ---
    location /auth/ {
        proxy_pass         http://127.0.0.1:4025;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # --- System endpoint (health checks) ---
    location /system/ {
        proxy_pass         http://127.0.0.1:4025;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # --- Public health endpoints ---
    location ~ ^/(health|status-whatsapp|session-status|diagnostics)$ {
        proxy_pass         http://127.0.0.1:4025;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # --- Socket.io (WebSocket upgrade) ---
    location /socket.io/ {
        proxy_pass              http://127.0.0.1:4025;
        proxy_http_version      1.1;
        proxy_set_header        Upgrade           $http_upgrade;
        proxy_set_header        Connection        "upgrade";
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_read_timeout      86400s;
        proxy_send_timeout      86400s;
        proxy_buffering         off;
    }

    # --- Media uploads (increase body size) ---
    location /send-media {
        proxy_pass         http://127.0.0.1:4025;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        client_max_body_size 25M;
        proxy_read_timeout   60s;
    }

    # --- Static asset caching ---
    location ~* \.(js|css|woff2|woff|ttf|png|ico|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # --- Gzip ---
    gzip              on;
    gzip_types        text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length   1000;
    gzip_vary         on;
}
