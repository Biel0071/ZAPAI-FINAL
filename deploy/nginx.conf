# ============================================================
# Nginx config for ZapAI CRM — HTTPS mode
#
# Replace YOUR_DOMAIN with your actual domain.
# Place at:  /etc/nginx/sites-available/zapai
# Enable:    ln -s /etc/nginx/sites-available/zapai /etc/nginx/sites-enabled/zapai
# Test:      nginx -t && systemctl reload nginx
#
# For HTTP-only (no domain), install.sh creates a simpler config.
# To add HTTPS after HTTP-only install:
#   apt install certbot python3-certbot-nginx
#   certbot --nginx -d YOUR_DOMAIN
# ============================================================

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=health_limit:10m rate=60r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=addr:10m;

server {
    listen 80;
    server_name YOUR_DOMAIN;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name YOUR_DOMAIN;

    # --- Connection limits ---
    limit_conn addr 50;

    # --- Timeouts (Slowloris protection) ---
    client_body_timeout 12s;
    client_header_timeout 12s;
    send_timeout 10s;
    keepalive_timeout 65s;
    keepalive_requests 100;
    reset_timedout_connection on;

    # --- TLS (Certbot will manage these) ---
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # --- Security headers ---
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' wss: https:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; media-src 'self' blob: https:; frame-ancestors 'self';" always;

    # --- Frontend (Vite build — built from frontend-official/) ---
    root /opt/zapai/frontend-official/dist;
    index index.html;

    location / {
        # No cache for index.html to prevent stale builds
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }
        try_files $uri $uri/ /index.html;
    }

    # --- Backend REST API ---
    # NOTE: trailing slash on proxy_pass strips /api prefix, so /api/health → /health on backend.
    # This matches the backend route definitions.
    location /api/ {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass         http://127.0.0.1:4025/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Request-ID      $request_id;
        proxy_set_header   Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 10s;
        client_max_body_size 25M;
    }

    # --- Auth endpoint — tighter rate limit (brute-force protection) ---
    location /auth/ {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass         http://127.0.0.1:4025;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Request-ID      $request_id;
    }

    # --- System endpoint (health checks) ---
    location /system/ {
        proxy_pass         http://127.0.0.1:4025;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # --- Public health endpoints ---
    location ~ ^/(health|status-whatsapp|session-status|diagnostics)$ {
        proxy_pass         http://127.0.0.1:4025;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # --- Socket.io (WebSocket upgrade) ---
    # IMPORTANT: proxy_read_timeout must be >> 60s for persistent WS connections.
    # A 60s timeout would disconnect all active users every minute.
    location /socket.io/ {
        proxy_pass              http://127.0.0.1:4025/socket.io/;
        proxy_http_version      1.1;
        proxy_set_header        Upgrade           $http_upgrade;
        proxy_set_header        Connection        "upgrade";
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_set_header        X-Request-ID      $request_id;
        proxy_read_timeout      3600s;  # 1 hour — WS connections are long-lived
        proxy_send_timeout      3600s;
        proxy_connect_timeout   10s;
        proxy_buffering         off;    # Required for real-time streaming
    }

    # --- Media uploads (increase body size) ---
    location /send-media {
        proxy_pass         http://127.0.0.1:4025;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        client_max_body_size 25M;
        proxy_read_timeout   60s;
    }

    location ^~ /uploads/ {
        proxy_pass         http://127.0.0.1:4025/uploads/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location ^~ /media/ {
        proxy_pass         http://127.0.0.1:4025/media/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # --- Static asset caching ---
    location ~* \.(js|css|woff2|woff|ttf|png|ico|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # --- Gzip ---
    gzip              on;
    gzip_types        text/plain text/css application/json application/javascript
                      text/xml application/xml application/wasm
                      image/svg+xml application/manifest+json;
    gzip_min_length   1000;
    gzip_vary         on;
    gzip_comp_level   5;
    gzip_proxied      any;

}
