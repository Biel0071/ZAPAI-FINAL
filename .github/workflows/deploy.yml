name: Deploy VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: zapai-vps-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/.ssh/id_rsa
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy on VPS
        shell: bash
        run: |
          ssh -o StrictHostKeyChecking=yes "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" <<'EOF'
            set -euo pipefail
            cd /root/ZAPAI-FINAL
            echo "[deploy] commit before: $(git rev-parse --short HEAD || true)"
            git pull --rebase origin main
            echo "[deploy] commit after:  $(git rev-parse --short HEAD || true)"
            bash deploy/update.sh
            docker compose --env-file .env.production -f docker-compose.production.yml ps
            docker compose --env-file .env.production -f docker-compose.production.yml logs --tail=120 backend frontend
          EOF
