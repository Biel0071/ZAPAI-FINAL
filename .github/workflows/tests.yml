name: CI Tests

on:
  push:
    branches: [ main, develop, lovable-sync ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend-official/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./frontend-official
        run: npm ci

      - name: Run Frontend Type Check (TSC)
        working-directory: ./frontend-official
        run: npm run tsc

      - name: Build Frontend
        working-directory: ./frontend-official
        run: npm run build

      - name: Run Frontend Unit Tests
        working-directory: ./frontend-official
        run: npm run test

      - name: Install Playwright Browsers
        working-directory: ./frontend-official
        run: npx playwright install --with-deps chromium

      - name: Run Frontend UI Tests
        working-directory: ./frontend-official
        run: npm run test-ui

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci
