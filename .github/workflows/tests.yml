name: CI Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            frontend-official/package-lock.json
            backend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend-official
        run: npm ci

      - name: Run Linter
        working-directory: ./frontend-official
        run: npm run lint

      - name: Build Frontend
        working-directory: ./frontend-official
        run: npm run build

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci
