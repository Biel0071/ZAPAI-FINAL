# ============================================================================
# ZAPAI MASTER NODE - DOCKER COMPOSE PRODUCTION
# ============================================================================
# 
# Zero mock. Tudo produção real.
# ============================================================================

version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: zapai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_in_production}
      POSTGRES_DB: zapai_crm
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    ports:
      - "5432:5432"
    networks:
      - zapai-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (for caching and queues)
  redis:
    image: redis:7-alpine
    container_name: zapai-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - zapai-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: zapai-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4025
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-changeme_in_production}@postgres:5432/zapai_crm
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: ${FRONTEND_URL:-https://localhost}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://localhost,http://localhost:8080}
      JWT_SECRET: ${JWT_SECRET:-changeme_in_production}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-changeme_in_production}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      USE_NGROK: false
      LOG_LEVEL: info
    volumes:
      - ../backend:/app
      - /app/node_modules
      - zapai_sessions:/app/sessions
      - zapai_uploads:/app/uploads
      - zapai_logs:/app/logs
    ports:
      - "4025:4025"
    networks:
      - zapai-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4025/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://localhost}
    container_name: zapai-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    networks:
      - zapai-network
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx Reverse Proxy (with SSL support)
  nginx:
    image: nginx:alpine
    container_name: zapai-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./ssl:/etc/nginx/ssl:ro
      - zapai_logs:/var/log/nginx
    networks:
      - zapai-network
    depends_on:
      - frontend
      - backend

  # Master Node Agent
  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: zapai-agent
    restart: unless-stopped
    environment:
      MASTER_API_URL: ${MASTER_API_URL:-https://your-master-api.com/api}
      NODE_ID: ${NODE_ID}
      NODE_TOKEN: ${NODE_TOKEN}
      LOCAL_API_PORT: 4025
      HEARTBEAT_INTERVAL: 30000
    volumes:
      - ./agent:/app
      - /app/node_modules
      - zapai_logs:/app/logs
    networks:
      - zapai-network
    depends_on:
      - backend

  # Backup Service (daily backups)
  backup:
    image: prodrigestivill/postgres-backup-local:15
    container_name: zapai-backup
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: zapai_crm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_in_production}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
    volumes:
      - ./backups:/backups
    networks:
      - zapai-network
    depends_on:
      - postgres

networks:
  zapai-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  zapai_sessions:
    driver: local
  zapai_uploads:
    driver: local
  zapai_logs:
    driver: local
