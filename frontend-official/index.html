<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>ZAPFLOW AI — Plataforma Inteligente de Atendimento</title>
    <meta name="description" content="ZAPFLOW AI — Plataforma inteligente de atendimento e automação via WhatsApp." />
    <meta name="author" content="ZAPFLOW AI" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="ZAPFLOW AI" />
    <meta property="og:description" content="Plataforma inteligente de atendimento e automação via WhatsApp." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="ZAPFLOW AI" />
    <meta name="twitter:description" content="Plataforma inteligente de atendimento e automação via WhatsApp." />

    <style>
      /* Pre-React loading indicator — shows immediately while JS bundles load */
      #root:empty {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background-color: #0a0f1a;
        color: #94a3b8;
        font-family: system-ui, -apple-system, sans-serif;
      }
      #root:empty::after {
        content: "Carregando ZAPFLOW AI…";
        font-size: 14px;
        animation: pulse 1.5s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }
      /* Hide the loading text once React mounts */
      #root:not(:empty)::after {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.addEventListener('error', function(e) {
        var root = document.getElementById('root');
        if (root && root.children.length === 0) {
          root.innerHTML = '<div style="display:flex;min-height:100vh;flex-direction:column;align-items:center;justify-content:center;background:#0a0f1a;color:#f8fafc;font-family:system-ui,-apple-system,sans-serif;padding:24px;text-align:center;">' +
            '<div style="max-width:440px;background:#131c2e;padding:32px;border-radius:12px;border:1px solid #1e293b;box-shadow:0 4px 20px rgba(0,0,0,0.4);">' +
            '<h2 style="font-size:18px;font-weight:700;margin-bottom:8px;color:#38bdf8;">ZAPFLOW AI</h2>' +
            '<p style="font-size:13px;color:#94a3b8;margin-bottom:20px;line-height:1.5;">Uma nova versão do sistema foi atualizada na VPS. Clique no botão abaixo para carregar a versão recente.</p>' +
            '<button onclick="sessionStorage.clear();localStorage.clear();location.reload()" style="padding:12px 24px;background:#10b981;color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px;width:100%;">Atualizar & Entrar</button>' +
            '</div></div>';
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
