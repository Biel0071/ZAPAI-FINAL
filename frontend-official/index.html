<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZAPFLOW AI — Plataforma Inteligente de Atendimento</title>
    <meta name="description" content="ZAPFLOW AI — Plataforma inteligente de atendimento e automação via WhatsApp." />
    <meta name="author" content="ZAPFLOW AI" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="ZAPFLOW AI" />
    <meta property="og:description" content="Plataforma inteligente de atendimento e automação via WhatsApp." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="ZAPFLOW AI" />
    <meta name="twitter:description" content="Plataforma inteligente de atendimento e automação via WhatsApp." />

    <style>
      /* Pre-React loading indicator — shows immediately while JS bundles load */
      #root:empty {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background-color: #0a0f1a;
        color: #94a3b8;
        font-family: system-ui, -apple-system, sans-serif;
      }
      #root:empty::after {
        content: "Carregando ZAPFLOW AI…";
        font-size: 14px;
        animation: pulse 1.5s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }
      /* Hide the loading text once React mounts */
      #root:not(:empty)::after {
        display: none;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
