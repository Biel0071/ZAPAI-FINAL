# ZAPFLOW AI ENTERPRISE - atomic SPA serving
server {
  listen 80;
  server_name _;

  root /var/www/zapflow/dist;
  index index.html;

  location /assets/ {
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache" always;
  }

  location / {
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
