name: zapai-production

services:
  nginx:
    image: nginx:alpine
    container_name: zapai-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      backend:
        condition: service_healthy
    logging: &default-logging
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  certbot:
    image: certbot/certbot
    container_name: zapai-certbot
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/www/certbot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done'"

  postgres:
    image: postgres:15-alpine
    container_name: zapai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zapai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zapadmin123}
      POSTGRES_DB: ${POSTGRES_DB:-zapai_crm}
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    # Not exposed to host — backend accesses via Docker network only
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups/postgres:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 15s
    logging: *default-logging

  redis:
    image: redis:7-alpine
    container_name: zapai-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    # Not exposed to host — backend accesses via Docker network only
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 10s
    logging: *default-logging

  postgres-backup:
    image: prodrigestivill/postgres-backup-local:15
    container_name: zapai-postgres-backup
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_EXTRA_OPTS: ${POSTGRES_BACKUP_EXTRA_OPTS:--Z9 --schema=public --blobs}
      SCHEDULE: ${BACKUP_SCHEDULE:-@daily}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
      BACKUP_KEEP_WEEKS: ${BACKUP_KEEP_WEEKS:-4}
      BACKUP_KEEP_MONTHS: ${BACKUP_KEEP_MONTHS:-6}
      BACKUP_DIR: /backups
    volumes:
      - ./backups/postgres:/backups
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging

  backend:
    image: zapai/backend:prod
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zapai-backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

    environment:
      NODE_ENV: production
      PORT: 4025
      MASTER: "${MASTER:-true}"
      MASTER_HOSTNAME: ${MASTER_HOSTNAME:-ZAP-AICRM}
      MASTER_VPS_IP: ${MASTER_VPS_IP:-127.0.0.1}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-zapai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zapadmin123}
      POSTGRES_DB: ${POSTGRES_DB:-zapai_crm}
      DATABASE_URL: postgresql://${POSTGRES_USER:-zapai}:${POSTGRES_PASSWORD:-zapadmin123}@postgres:5432/${POSTGRES_DB:-zapai_crm}
      FRONTEND_URL: ${FRONTEND_URL}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      MASTER_PANEL_TOKEN: ${MASTER_PANEL_TOKEN}
      NODE_REGISTRATION_TOKEN: ${NODE_REGISTRATION_TOKEN}
      JWT_SECRET: ${JWT_SECRET:-zapadmin_secret_key_123456789}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-zapadmin_secret_key_123456789}
      AUTH_DEFAULT_USERNAME: ${AUTH_DEFAULT_USERNAME:-zapadmin}
      AUTH_DEFAULT_EMAIL: ${AUTH_DEFAULT_EMAIL:-admin@admin.com}
      AUTH_DEFAULT_PASSWORD: ${AUTH_DEFAULT_PASSWORD:-zapadmin123}
      AUTH_DEFAULT_ROLE: ${AUTH_DEFAULT_ROLE:-master_admin}
      AUTH_DEFAULT_TENANT_ID: ${AUTH_DEFAULT_TENANT_ID:-default}
      DB_WAIT_TIMEOUT_SECONDS: ${DB_WAIT_TIMEOUT_SECONDS:-120}
      DB_WAIT_INTERVAL_SECONDS: ${DB_WAIT_INTERVAL_SECONDS:-2}
      PGSSLMODE: disable
      DB_SSL: "false"
      REDIS_URL: redis://redis:6379
    # Not exposed to host — only nginx reaches backend via Docker network
    expose:
      - "4025"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - zapai_sessions:/app/sessions
      - zapai_uploads:/app/uploads
      - ./logs/backend:/app/logs
      - ./:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 5 -O /dev/null http://localhost:4025/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 40s
    logging: *default-logging

volumes:
  postgres_data:
  redis_data:
  zapai_sessions:
  zapai_uploads:
