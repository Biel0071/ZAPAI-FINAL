services:
  postgres:
    image: postgres:15-alpine
    container_name: zapai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zapai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zapai_password}
      POSTGRES_DB: ${POSTGRES_DB:-zapai_crm}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zapai} -d ${POSTGRES_DB:-zapai_crm}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: zapai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zapai-backend
    restart: unless-stopped
    ports:
      - "4025:4025"
    environment:
      NODE_ENV: production
      PORT: 4025
      DATABASE_URL: postgresql://${POSTGRES_USER:-zapai}:${POSTGRES_PASSWORD:-zapai_password}@postgres:5432/${POSTGRES_DB:-zapai_crm}
      JWT_SECRET: ${JWT_SECRET:-change_me_min_64_chars_random_string_please_change_this_in_production}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-change_me_min_64_chars_random_string_please_change_this_in_production}
      AUTH_DEFAULT_USERNAME: ${AUTH_DEFAULT_USERNAME:-admin}
      AUTH_DEFAULT_PASSWORD: ${AUTH_DEFAULT_PASSWORD:-admin123}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,https://swift-wa-assist.lovable.app}
      DEFAULT_COMPANY_ID: default
      USE_NGROK: "false"
      NGROK_MANAGED_EXTERNALLY: "true"
      CRASH_EXIT_ON_UNHANDLED: "true"
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - zapai_sessions:/app/sessions
      - zapai_uploads:/app/uploads
      - zapai_logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:4025/api/health || wget -q -O /dev/null http://localhost:4025/health"]
      interval: 15s
      timeout: 5s
      retries: 20

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: zapai-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:4025}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
  redis_data:
  zapai_sessions:
  zapai_uploads:
  zapai_logs:
