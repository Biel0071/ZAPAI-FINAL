# ============================================================================
# DOCKER COMPOSE - FRONTEND PRODUCTION
# ============================================================================

version: '3.8'

services:
  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: zapai-frontend
    ports:
      - "80:80"
      - "443:443"
    environment:
      - VITE_API_URL=${VITE_API_URL}
      - NODE_ENV=production
    restart: always
    networks:
      - zapai-network
    volumes:
      - ./nginx-ssl:/etc/nginx/ssl:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  zapai-network:
    driver: bridge
