version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: zapai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: zapai
      POSTGRES_PASSWORD: zapai_password
      POSTGRES_DB: zapai_crm
      POSTGRES_HOST: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zapai"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (optional - for enterprise features)
  redis:
    image: redis:7-alpine
    container_name: zapai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - enterprise

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zapai-backend
    restart: unless-stopped
    ports:
      - "4025:4025"
    environment:
      NODE_ENV: production
      PORT: 4025
      DATABASE_URL: postgresql://zapai:zapai_password@postgres:5432/zapai_crm
      JWT_SECRET: ${JWT_SECRET:-change_me_min_64_chars_random_string_please_change_this_in_production}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-change_me_min_64_chars_random_string_please_change_this_in_production}
      USE_NGROK: "false"
      NGROK_MANAGED_EXTERNALLY: "true"
      CRASH_EXIT_ON_UNHANDLED: "true"
      LOG_LEVEL: info
      FRONTEND_URL: http://localhost:3000
      CORS_ALLOWED_ORIGINS: http://localhost:3000,https://swift-wa-assist.lovable.app
      DEFAULT_COMPANY_ID: default
      AUTH_DEFAULT_USERNAME: admin
      POSTGRES_HOST: postgres
      POSTGRES_USER: zapai
      POSTGRES_PASSWORD: zapai_password
      POSTGRES_DB: zapai_crm
      AUTH_DEFAULT_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    depends_on:
      postgres:
        condish oockne-vntiypointc_hhealthy
    volumes:
      - zapai_sessions:/app/sessions
      - zapai_uploads:/app/uploads
      - zapai_logs:/app/logs
    command: node server.js

  # Frontend (production build)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: zapai-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:4025}
    depends_on:
      - backend
    profiles:
      - production

volumes:
  postgres_data:
  redis_data:
  zapai_sessions:
  zapai_uploads:
  zapai_logs:
